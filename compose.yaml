services:
  db:
    image: postgres:16.1
    container_name: postgresNotificationService
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=notificationservice
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"